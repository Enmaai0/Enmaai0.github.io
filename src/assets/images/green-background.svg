<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3d39c" />
      <stop offset="100%" stop-color="#4c7d46" />
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="30" />
    </filter>
  </defs>
  
  <!-- Base background -->
  <rect width="100%" height="100%" fill="url(#bg-gradient)" />
  
  <!-- Blurred circles to create depth -->
  <circle cx="300" cy="200" r="250" fill="#ffffff" opacity="0.15" filter="url(#blur)" />
  <circle cx="1600" cy="800" r="300" fill="#ffffff" opacity="0.1" filter="url(#blur)" />
  <circle cx="1000" cy="400" r="200" fill="#ffffff" opacity="0.05" filter="url(#blur)" />
  <circle cx="500" cy="900" r="180" fill="#ffffff" opacity="0.08" filter="url(#blur)" />
  
  <!-- Light rays -->
  <path d="M0,0 L1920,1080" stroke="#ffffff" stroke-width="5" opacity="0.03" />
  <path d="M1920,0 L0,1080" stroke="#ffffff" stroke-width="3" opacity="0.02" />
  <path d="M960,0 L960,1080" stroke="#ffffff" stroke-width="4" opacity="0.02" />
  <path d="M0,540 L1920,540" stroke="#ffffff" stroke-width="4" opacity="0.02" />
</svg>